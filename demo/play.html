<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>像素田园 · AI 幸存者</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: #000; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Courier New', monospace;
  }
  #game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #hud {
    position: fixed; top: 10px; left: 10px; right: 10px;
    color: #fff; font-size: 13px;
    text-shadow: 1px 1px 2px #000;
    display: flex; justify-content: space-between;
    pointer-events: none; z-index: 10;
  }
  #hpbar {
    position: fixed; bottom: 14px; left: 50%;
    transform: translateX(-50%);
    width: 220px; height: 16px;
    background: #400; border: 2px solid #fff;
    z-index: 10;
  }
  #hpfill { height: 100%; background: linear-gradient(90deg, #e33, #f77); width: 100%; transition: width 0.1s; }
  #hptext {
    position: fixed; bottom: 34px; left: 50%;
    transform: translateX(-50%);
    color: #fff; font-size: 11px;
    text-shadow: 1px 1px 2px #000; z-index: 10;
  }
  #err {
    position: fixed; top: 40px; left: 10px;
    color: #f66; font-size: 10px; max-width: 400px;
    background: rgba(0,0,0,0.85); padding: 6px;
    display: none; z-index: 20; line-height: 1.5;
  }
  #levelup {
    position: fixed; inset: 0; z-index: 30;
    display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: rgba(0,0,0,0.72);
  }
  .lu-title { color: #ffd166; font-size: 20px; text-shadow: 2px 2px 0 #000; }
  .lu-cards { display: flex; gap: 14px; }
  .lu-card {
    width: 120px; padding: 16px 10px; text-align: center;
    background: #1c2430; border: 2px solid #7df9ff; border-radius: 6px;
    color: #fff; font-size: 14px; cursor: pointer;
  }
  .lu-card:hover { background: #2a3648; transform: translateY(-3px); }
  .lu-card .ico { font-size: 24px; display: block; margin-bottom: 8px; }
  .lu-hint { color: #8899aa; font-size: 11px; }
</style>
</head>
<body>
<canvas id="game" width="640" height="360"></canvas>
<div id="hud">
  <div>时间: <span id="time">0:00</span></div>
  <div>击杀: <span id="kills">0</span></div>
  <div>等级: <span id="level">1</span></div>
</div>
<div id="hpbar"><div id="hpfill"></div></div>
<div id="hptext">100 / 100</div>
<div id="err"></div>
<div id="levelup"></div>

<script type="module">
// 全局错误显示
window.addEventListener('error', (e) => {
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = 'ERR: ' + e.message;
});

const LOGIC_W = 640, LOGIC_H = 360;
const WORLD_W = 1600, WORLD_H = 1200;
const ATTACK_RANGE = 220;
const KEEP_DIST = 100;
const RESPAWN_DELAY = 2.0;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

function fit() {
  const s = Math.max(1, Math.floor(Math.min(window.innerWidth / LOGIC_W, window.innerHeight / LOGIC_H)));
  canvas.style.width = (LOGIC_W * s) + 'px';
  canvas.style.height = (LOGIC_H * s) + 'px';
}
window.addEventListener('resize', fit);
fit();

// ===== 素材 =====
let manifest = null;
const charTextures = {};
let charNames = [];
let usingChar = null;
let playerTex = null;

function loadImg(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error(src));
    img.src = src;
  });
}

async function loadAllChars() {
  try {
    const r = await fetch('assets/char/manifest.json', { cache: 'no-store' });
    manifest = await r.json();
  } catch (e) {
    console.warn('manifest fail', e);
    return;
  }
  const names = Object.keys(manifest.characters || {});
  for (const n of names) {
    try {
      const ch = manifest.characters[n];
      const tex = {};
      for (const [dir, acts] of Object.entries(ch)) {
        tex[dir] = {};
        for (const [act, files] of Object.entries(acts)) {
          tex[dir][act] = await Promise.all(files.map(f => loadImg(`assets/char/${n}/${f}`)));
        }
      }
      const fd = Object.keys(tex)[0];
      const fa = Object.keys(tex[fd])[0];
      const img0 = tex[fd][fa][0];
      tex.frameW = img0.naturalWidth;
      tex.frameH = img0.naturalHeight;
      charTextures[n] = tex;
      charNames.push(n);
    } catch (e) {
      console.warn('load char fail', n, e.message);
    }
  }
  usingChar = charNames.includes('villager') ? 'villager' : (charNames[0] || null);
  if (usingChar) playerTex = charTextures[usingChar];
}

// ===== 状态 =====
let player = null;
let enemies = [];
let bullets = [];
let ebullets = [];   // 敌方弹幕
let particles = [];
let floats = [];
let gems = [];
let camX = 0, camY = 0;
let gameTime = 0;
let kills = 0;
let level = 1;
let xp = 0;
let xpNext = 10;
let spawnTimer = 0;
let deadTimer = 0;
let gameState = 'playing';   // playing / dead

// ===== HUD =====
const $ = id => document.getElementById(id);
function updateHud() {
  const s = Math.floor(gameTime % 60);
  $('time').textContent = Math.floor(gameTime / 60) + ':' + String(s).padStart(2, '0');
  $('kills').textContent = kills;
  $('level').textContent = level;
  if (player) {
    const pct = Math.max(0, player.hp / player.maxHp * 100);
    $('hpfill').style.width = pct + '%';
    $('hptext').textContent = Math.max(0, Math.ceil(player.hp)) + ' / ' + player.maxHp;
  }
}

// ===== 玩家 =====
class Player {
  constructor() {
    this.x = WORLD_W / 2;
    this.y = WORLD_H / 2;
    this.maxHp = 100;
    this.hp = 100;
    this.speed = 80;
    this.dmg = 8;
    this.atkSpeed = 0.5;
    this.projSpeed = 220;
    this.projCount = 1;   // 多弹道增益
    this.pierce = 0;      // 穿透增益
    this.critChance = 0.15;  // 暴击率
    this.critMul = 2;        // 暴击倍率
    this.atkTimer = 0;
    this.iframe = 0;
    this.facing = 'down';
    this.dir = 1;
    this.frameIdx = 0;
    this.frameTimer = 0;
    this.state = 'idle';
    this.aiDir = [0, 0];
    this.aiTimer = 0;
  }

  aiMove(dt) {
    // 收集附近敌人
    let nearest = null, nearestD = 9999;
    let avgFx = 0, avgFy = 0, closeN = 0;

    for (const e of enemies) {
      const dx = e.x - this.x;
      const dy = e.y - this.y;
      const d = Math.hypot(dx, dy);
      if (d < nearestD) { nearestD = d; nearest = e; }
      if (d < 130) {
        closeN++;
        const w = 1 / (d + 1);
        avgFx += dx * w;
        avgFy += dy * w;
      }
    }

    let dx = 0, dy = 0;

    if (closeN > 0) {
      // 有威胁: 优先远离 + 侧移
      const l = Math.hypot(avgFx, avgFy) || 1;
      dx = -avgFx / l;
      dy = -avgFy / l;
      // 加一点侧移, 避免贴着跑
      const perpX = -dy, perpY = dx;
      const sideSign = (Math.floor(gameTime * 2) % 2 === 0) ? 1 : -1;
      dx += perpX * 0.6 * sideSign;
      dy += perpY * 0.6 * sideSign;
    } else if (nearest && nearestD > ATTACK_RANGE * 1.4) {
      // 太远: 追击
      const l = Math.hypot(nearest.x - this.x, nearest.y - this.y) || 1;
      dx = (nearest.x - this.x) / l;
      dy = (nearest.y - this.y) / l;
    } else if (nearest && nearestD < KEEP_DIST) {
      // 太近: 后退
      const l = Math.hypot(nearest.x - this.x, nearest.y - this.y) || 1;
      dx = (this.x - nearest.x) / l;
      dy = (this.y - nearest.y) / l;
    } else {
      // 合适距离: 环绕
      if (nearest) {
        const ang = Math.atan2(this.y - nearest.y, this.x - nearest.x) + 0.3;
        dx = Math.cos(ang);
        dy = Math.sin(ang);
      } else {
        // 无敌人: 随机游走
        this.aiTimer -= dt;
        if (this.aiTimer <= 0) {
          const a = Math.random() * Math.PI * 2;
          this.aiDir = [Math.cos(a), Math.sin(a)];
          this.aiTimer = 1.5 + Math.random() * 1.5;
        }
        dx = this.aiDir[0];
        dy = this.aiDir[1];
      }
    }

    // 边界回避
    const M = 100;
    if (this.x < M) dx += (M - this.x) / M * 2;
    if (this.x > WORLD_W - M) dx -= (this.x - (WORLD_W - M)) / M * 2;
    if (this.y < M) dy += (M - this.y) / M * 2;
    if (this.y > WORLD_H - M) dy -= (this.y - (WORLD_H - M)) / M * 2;

    const l = Math.hypot(dx, dy) || 1;
    return [dx / l, dy / l];
  }

  update(dt) {
    if (this.iframe > 0) this.iframe -= dt;

    const [dx, dy] = this.aiMove(dt);
    const moving = Math.abs(dx) > 0.01 || Math.abs(dy) > 0.01;

    if (moving) {
      this.x += dx * this.speed * dt;
      this.y += dy * this.speed * dt;
      this.x = Math.max(20, Math.min(WORLD_W - 20, this.x));
      this.y = Math.max(30, Math.min(WORLD_H - 10, this.y));
      if (Math.abs(dy) > Math.abs(dx)) {
        this.facing = dy < 0 ? 'up' : 'down';
      } else {
        this.facing = 'side';
        this.dir = dx > 0 ? 1 : -1;
      }
      if (this.state !== 'walk') { this.state = 'walk'; this.frameIdx = 0; this.frameTimer = 0; }
    } else {
      if (this.state !== 'idle') { this.state = 'idle'; this.frameIdx = 0; this.frameTimer = 0; }
    }

    // 自动攻击
    this.atkTimer -= dt;
    if (this.atkTimer <= 0) {
      let target = null, tD = Infinity;
      for (const e of enemies) {
        const d = Math.hypot(e.x - this.x, e.y - this.y);
        if (d < tD && d < ATTACK_RANGE) { tD = d; target = e; }
      }
      if (target) {
        const baseA = Math.atan2(target.y - this.y, target.x - this.x);
        const n = this.projCount;
        for (let i = 0; i < n; i++) {
          // 多弹道: 围绕目标方向扇形散开
          const a = baseA + (i - (n - 1) / 2) * 0.12;
          bullets.push({
            x: this.x, y: this.y - 12,
            vx: Math.cos(a) * this.projSpeed,
            vy: Math.sin(a) * this.projSpeed,
            dmg: this.dmg, life: 1.5, pierce: this.pierce, hits: null, dead: false,
          });
        }
        this.atkTimer = this.atkSpeed;
      } else {
        this.atkTimer = 0.1;
      }
    }

    // 帧动画
    const fps = this.state === 'walk' ? 8 : 4;
    this.frameTimer += dt;
    if (this.frameTimer > 1 / fps) {
      this.frameTimer = 0;
      this.frameIdx++;
    }
  }

  takeDamage(dmg) {
    if (this.iframe > 0) return;
    this.hp -= dmg;
    this.iframe = 0.4;
    if (this.hp <= 0) {
      this.hp = 0;
      gameState = 'dead';
      deadTimer = RESPAWN_DELAY;
    }
    updateHud();
  }

  draw() {
    const sx = Math.round(this.x - camX);
    const sy = Math.round(this.y - camY);
    // 影子
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(sx, sy + 1, 8, 3, 0, 0, Math.PI * 2);
    ctx.fill();

    // 有素材用素材
    if (playerTex) {
      const dd = playerTex[this.facing] || playerTex.down || playerTex.side;
      if (dd) {
        const arr = dd[this.state] || dd.idle;
        if (arr && arr.length) {
          if (!(this.iframe > 0 && Math.floor(this.iframe * 20) % 2 === 0)) {
            const img = arr[this.frameIdx % arr.length];
            const fw = playerTex.frameW, fh = playerTex.frameH;
            ctx.save();
            ctx.translate(sx, sy);
            if (this.facing === 'side') ctx.scale(this.dir, 1);
            ctx.drawImage(img, -Math.floor(fw / 2), -fh);
            ctx.restore();
          }
          return;
        }
      }
    }

    // fallback: 色块小人
    ctx.fillStyle = '#4a8a3a';
    ctx.fillRect(sx - 5, sy - 10, 10, 10);
    ctx.fillStyle = '#f2c9a0';
    ctx.beginPath();
    ctx.arc(sx, sy - 14, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#4a4a6e';
    ctx.fillRect(sx - 4, sy, 3, 3);
    ctx.fillRect(sx + 1, sy, 3, 3);
  }
}

// ===== 敌人 =====
// kind: chase 追击(默认) / charger 冲刺球 / splitter 分裂球 / shooter 远程弹幕球
const ENEMY_TYPES = [
  { color: '#e33', hp: 10, speed: 45, size: 6, dmg: 8, xp: 1 },
  { color: '#f80', hp: 15, speed: 55, size: 7, dmg: 10, xp: 2 },
  { color: '#f0f', hp: 22, speed: 38, size: 8, dmg: 12, xp: 3 },
  { color: '#3cf', hp: 35, speed: 32, size: 10, dmg: 15, xp: 5 },
  { color: '#ff0', hp: 70, speed: 26, size: 13, dmg: 20, xp: 10 },
  { kind: 'charger',  color: '#ff5da2', hp: 18, speed: 30, size: 7, dmg: 14, xp: 4 },
  { kind: 'splitter', color: '#8fe040', hp: 20, speed: 36, size: 9, dmg: 10, xp: 4 },
  { kind: 'shooter',  color: '#9d6bff', hp: 16, speed: 28, size: 7, dmg: 8,  xp: 5 },
];

function pickType() {
  let maxI = 0;
  if (gameTime > 10) maxI = 1;
  if (gameTime > 30) maxI = 2;
  if (gameTime > 60) maxI = 3;
  if (gameTime > 90) maxI = 4;
  if (gameTime > 100) maxI = 5;   // 冲刺球
  if (gameTime > 120) maxI = 6;   // 分裂球
  if (gameTime > 140) maxI = 7;   // 弹幕球
  return ENEMY_TYPES[Math.floor(Math.random() * (maxI + 1))];
}

function spawnEnemy() {
  const a = Math.random() * Math.PI * 2;
  const d = 360 + Math.random() * 80;
  const t = pickType();
  enemies.push({
    x: player.x + Math.cos(a) * d,
    y: player.y + Math.sin(a) * d,
    hp: t.hp, maxHp: t.hp,
    speed: t.speed, size: t.size,
    dmg: t.dmg, xp: t.xp, color: t.color,
    kind: t.kind || 'chase',
    wobble: Math.random() * Math.PI * 2,
    flash: 0,   // 命中闪白计时
    mode: 'walk', modeT: 0, dvx: 0, dvy: 0,   // charger 状态机
    shootT: 1 + Math.random() * 1.5,          // shooter 开火计时
    dead: false,
  });
}

// 分裂球死后爆出的小球
function spawnMini(x, y, color) {
  enemies.push({
    x: x + (Math.random() - 0.5) * 10, y: y + (Math.random() - 0.5) * 10,
    hp: 6, maxHp: 6, speed: 60, size: 4, dmg: 5, xp: 1, color,
    kind: 'chase', wobble: 0, flash: 0,
    mode: 'walk', modeT: 0, dvx: 0, dvy: 0, shootT: 0,
    dead: false,
  });
}

// ===== 经验宝石 (敌人死亡掉落, 靠近吸附, 拾取攒经验) =====
const GEM_MAGNET_R = 90;   // 吸附半径
const GEM_PICK_R = 10;     // 拾取半径
function spawnGem(x, y, value) {
  gems.push({ x, y, value, bob: Math.random() * Math.PI * 2, vx: 0, vy: 0 });
}
function updateGems(dt) {
  for (const g of gems) {
    const dx = player.x - g.x, dy = player.y - g.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d < GEM_PICK_R) {
      g.dead = true;
      // 升级则暂停弹三选一; 已在选卡界面时攒着, 选完下颗宝石再触发
      if (gainXp(g.value) > 0 && gameState === 'playing') showLevelUp();
      popText(g.x, g.y - 10, '+' + g.value, '#7df9ff');
    } else if (d < GEM_MAGNET_R) {
      // 越近吸得越快
      const pull = 260 * (1 - d / GEM_MAGNET_R) + 60;
      g.vx += dx / d * pull * dt * 6;
      g.vy += dy / d * pull * dt * 6;
    }
    g.vx *= 0.9; g.vy *= 0.9;
    g.x += g.vx * dt;
    g.y += g.vy * dt;
    g.bob += dt * 4;
  }
  gems = gems.filter(g => !g.dead);
}

// ===== 粒子/飘字 =====
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 40 + Math.random() * 60;
    particles.push({
      x, y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20,
      life: 0.4, maxLife: 0.4,
      color, size: 1 + Math.random() * 2,
    });
  }
}

function popText(x, y, text, color, size) {
  floats.push({ x, y, text, color, size: size || 9, life: 0.8, maxLife: 0.8, vy: -40 });
}

// 屏幕震动: t=时长秒, mag=幅度px
let shakeT = 0, shakeDur = 0, shakeMag = 0;
function addShake(t, mag) {
  if (t > shakeT) { shakeT = t; shakeDur = t; }
  shakeMag = Math.max(shakeMag, mag);
}

// ===== 游戏重置 =====
function reset() {
  player = new Player();
  // 应用素材角色属性微调 (不同角色差异)
  if (usingChar === 'girl') { player.speed = 100; player.dmg = 6; player.atkSpeed = 0.4; player.maxHp = 80; player.hp = 80; }
  else if (usingChar === 'elder') { player.speed = 60; player.dmg = 12; player.atkSpeed = 0.8; player.maxHp = 130; player.hp = 130; }
  else if (usingChar === 'merchant') { player.speed = 85; player.dmg = 10; player.atkSpeed = 0.6; }
  else if (usingChar === 'child') { player.speed = 110; player.dmg = 5; player.atkSpeed = 0.35; player.maxHp = 70; player.hp = 70; }

  enemies = [];
  bullets = [];
  ebullets = [];
  particles = [];
  floats = [];
  gems = [];
  gameTime = 0;
  kills = 0;
  level = 1;
  xp = 0;
  xpNext = 10;
  spawnTimer = 0;
  deadTimer = 0;
  shakeT = 0; shakeDur = 0; shakeMag = 0;
  gameState = 'playing';
  camX = player.x - LOGIC_W / 2;
  camY = player.y - LOGIC_H / 2;
  camX = Math.max(0, Math.min(WORLD_W - LOGIC_W, camX));
  camY = Math.max(0, Math.min(WORLD_H - LOGIC_H, camY));
  updateHud();
}

// ===== 升级三选一 (升级暂停弹卡, AI 1.2s 后自动选, 也可点击) =====
const UPGRADES = [
  { id: 'dmg',    ico: '⚔', name: '攻击 +2',   apply: p => p.dmg += 2 },
  { id: 'speed',  ico: '👟', name: '移速 +15',  apply: p => p.speed += 15 },
  { id: 'hp',     ico: '♥', name: '血量 +25',  apply: p => { p.maxHp += 25; p.hp = Math.min(p.maxHp, p.hp + 25); } },
  { id: 'rate',   ico: '⚡', name: '射速 +15%', apply: p => p.atkSpeed = Math.max(0.12, p.atkSpeed * 0.85) },
  { id: 'multi',  ico: '☄', name: '弹道 +1',   apply: p => p.projCount += 1 },
  { id: 'pierce', ico: '➹', name: '穿透 +1',   apply: p => p.pierce += 1 },
];
// AI 选卡偏好: 弹道/穿透优先, 残血优先补血
function aiPickCard(cards) {
  const pref = { multi: 6, pierce: 5, dmg: 4, rate: 3, speed: 1, hp: player.hp < player.maxHp * 0.5 ? 7 : 2 };
  let best = cards[0];
  for (const c of cards) if ((pref[c.id] || 0) > (pref[best.id] || 0)) best = c;
  return best;
}
let levelupTimer = 0;
function showLevelUp() {
  gameState = 'levelup';
  levelupTimer = 1.2;
  const pool = [...UPGRADES];
  const cards = [];
  for (let i = 0; i < 3; i++) cards.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  const box = $('levelup');
  box.innerHTML = '<div class="lu-title">LEVEL UP 三选一</div><div class="lu-cards"></div><div class="lu-hint">AI 自动选择中...</div>';
  const row = box.querySelector('.lu-cards');
  for (const c of cards) {
    const d = document.createElement('div');
    d.className = 'lu-card';
    d.innerHTML = `<span class="ico">${c.ico}</span>${c.name}`;
    d.onclick = () => pickUpgrade(c);
    row.appendChild(d);
  }
  box._cards = cards;
  box.style.display = 'flex';
}
function pickUpgrade(c) {
  c.apply(player);
  popText(player.x, player.y - 30, c.name, '#7df9ff');
  $('levelup').style.display = 'none';
  gameState = 'playing';
  updateHud();
}

// ===== 升级 =====
function gainXp(n) {
  xp += n;
  let ups = 0;
  while (xp >= xpNext) {
    xp -= xpNext;
    level++;
    ups++;
    xpNext = Math.floor(xpNext * 1.5);
    popText(player.x, player.y - 30, 'LEVEL UP', '#ffd166');
  }
  updateHud();
  return ups;
}

// ===== 主循环 =====
let lastT = performance.now();
let rafId = null;

function loop(t) {
  rafId = requestAnimationFrame(loop);
  try {
    const dt = Math.min(0.05, (t - lastT) / 1000);
    lastT = t;

    if (gameState === 'dead') {
      deadTimer -= dt;
      if (deadTimer <= 0) reset();
      render();
      return;
    }

    // 选卡暂停: 只渲染 + AI 倒计时自动选
    if (gameState === 'levelup') {
      levelupTimer -= dt;
      if (levelupTimer <= 0) pickUpgrade(aiPickCard($('levelup')._cards));
      render();
      updateHud();
      return;
    }

    gameTime += dt;

    // 生成敌人
    spawnTimer += dt;
    const spawnRate = Math.max(0.18, 0.9 - gameTime * 0.008);
    if (spawnTimer > spawnRate) {
      spawnTimer = 0;
      spawnEnemy();
      if (gameTime > 30 && Math.random() < 0.5) spawnEnemy();
      if (gameTime > 60 && Math.random() < 0.4) spawnEnemy();
    }

    player.update(dt);

    // 敌人
    for (const e of enemies) {
      if (e.dead) continue;
      const dx = player.x - e.x, dy = player.y - e.y;
      const d = Math.hypot(dx, dy) || 1;
      if (e.kind === 'charger') {
        // 冲刺球: 靠近 -> 蓄力(闪白停顿) -> 高速直线冲刺 -> 回到追击
        e.modeT -= dt;
        if (e.mode === 'walk') {
          e.x += dx / d * e.speed * dt;
          e.y += dy / d * e.speed * dt;
          if (d < 140) { e.mode = 'windup'; e.modeT = 0.5; }
        } else if (e.mode === 'windup') {
          e.flash = 0.05;   // 蓄力发白预警
          if (e.modeT <= 0) {
            e.mode = 'dash'; e.modeT = 0.5;
            e.dvx = dx / d; e.dvy = dy / d;
          }
        } else {   // dash
          e.x += e.dvx * e.speed * 4 * dt;
          e.y += e.dvy * e.speed * 4 * dt;
          if (e.modeT <= 0) e.mode = 'walk';
        }
      } else if (e.kind === 'shooter') {
        // 弹幕球: 保持 120-170 距离环绕, 每 2.2s 向玩家发一颗弹
        if (d > 170) { e.x += dx / d * e.speed * dt; e.y += dy / d * e.speed * dt; }
        else if (d < 120) { e.x -= dx / d * e.speed * 0.7 * dt; e.y -= dy / d * e.speed * 0.7 * dt; }
        else {
          // 侧向环绕
          e.x += -dy / d * e.speed * 0.5 * dt;
          e.y += dx / d * e.speed * 0.5 * dt;
        }
        e.shootT -= dt;
        if (e.shootT <= 0 && d < 260) {
          e.shootT = 2.2;
          ebullets.push({ x: e.x, y: e.y, vx: dx / d * 130, vy: dy / d * 130, dmg: e.dmg, life: 3, dead: false });
        }
      } else {
        // chase / splitter: 直线追击
        e.x += dx / d * e.speed * dt;
        e.y += dy / d * e.speed * dt;
      }
      e.wobble += dt * 8;
      if (e.flash > 0 && e.mode !== 'windup') e.flash -= dt;
      if (d < e.size + 6) player.takeDamage(e.dmg);
    }

    // 敌方弹幕
    for (const b of ebullets) {
      if (b.dead) continue;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      if (b.life <= 0) { b.dead = true; continue; }
      if (Math.hypot(b.x - player.x, b.y - player.y) < 8) {
        b.dead = true;
        player.takeDamage(b.dmg);
      }
    }
    ebullets = ebullets.filter(b => !b.dead);

    // 子弹
    for (const b of bullets) {
      if (b.dead) continue;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      if (b.life <= 0) { b.dead = true; continue; }
      for (const e of enemies) {
        if (e.dead) continue;
        if (b.hits && b.hits.has(e)) continue;   // 穿透弹不重复打同一敌人
        if (Math.hypot(b.x - e.x, b.y - e.y) < e.size + 3) {
          // 暴击: 命中时掷一次, 伤害 x2 且飘字更大更亮
          const crit = Math.random() < player.critChance;
          const dmg = Math.round(b.dmg * (crit ? player.critMul : 1));
          e.hp -= dmg;
          e.flash = 0.08;
          burst(b.x, b.y, e.color, crit ? 5 : 3);
          popText(e.x, e.y - e.size * 2 - 4, String(dmg), crit ? '#ffb020' : '#ffffff', crit ? 13 : 9);
          addShake(crit ? 0.14 : 0.06, crit ? 3 : 1.2);
          if (b.pierce > 0) {
            b.pierce--;
            (b.hits || (b.hits = new Set())).add(e);
          } else {
            b.dead = true;
          }
          if (e.hp <= 0) {
            e.dead = true;
            kills++;
            burst(e.x, e.y, e.color, 8);
            addShake(0.12, 2.5);
            spawnGem(e.x, e.y, e.xp);
            if (e.kind === 'splitter') {   // 分裂球死后爆出 2 个小球
              spawnMini(e.x, e.y, e.color);
              spawnMini(e.x, e.y, e.color);
            }
          }
          if (b.dead) break;
        }
      }
    }
    bullets = bullets.filter(b => !b.dead && b.life > 0);
    enemies = enemies.filter(e => !e.dead);

    updateGems(dt);

    // 粒子
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 100 * dt;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);

    for (const f of floats) {
      f.y += f.vy * dt;
      f.life -= dt;
    }
    floats = floats.filter(f => f.life > 0);

    // 屏幕震动衰减
    if (shakeT > 0) {
      shakeT -= dt;
      if (shakeT <= 0) shakeMag = 0;
    }

    // 相机
    camX = player.x - LOGIC_W / 2;
    camY = player.y - LOGIC_H / 2;
    camX = Math.max(0, Math.min(WORLD_W - LOGIC_W, camX));
    camY = Math.max(0, Math.min(WORLD_H - LOGIC_H, camY));
    camX = Math.round(camX);
    camY = Math.round(camY);

    render();
    updateHud();
  } catch (e) {
    const el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent = 'LOOP ERR: ' + e.message;
    console.error(e);
  }
}

function render() {
  ctx.save();
  // 屏幕震动: 幅度随时长衰减
  if (shakeT > 0 && shakeDur > 0) {
    const k = shakeMag * (shakeT / shakeDur);
    ctx.translate((Math.random() - 0.5) * 2 * k, (Math.random() - 0.5) * 2 * k);
  }

  // 背景
  ctx.fillStyle = '#3a5a2a';
  ctx.fillRect(0, 0, LOGIC_W, LOGIC_H);

  // 网格
  const gs = 32;
  const sx0 = Math.floor(camX / gs) * gs;
  const sy0 = Math.floor(camY / gs) * gs;
  for (let gy = sy0; gy < camY + LOGIC_H + gs; gy += gs) {
    for (let gx = sx0; gx < camX + LOGIC_W + gs; gx += gs) {
      const sx = gx - camX, sy = gy - camY;
      const dark = ((gx / gs) + (gy / gs)) % 2 === 0;
      ctx.fillStyle = dark ? '#385a28' : '#3e5f2e';
      ctx.fillRect(sx, sy, gs, gs);
    }
  }

  // 敌人
  for (const e of enemies) {
    const sx = e.x - camX, sy = e.y - camY;
    if (sx < -40 || sx > LOGIC_W + 40 || sy < -40 || sy > LOGIC_H + 40) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(sx, sy + e.size * 0.7, e.size * 0.9, e.size * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    const wob = Math.sin(e.wobble) * 1.5;
    ctx.fillStyle = e.flash > 0 ? '#ffffff' : e.color;   // 命中闪白
    ctx.beginPath();
    ctx.arc(sx, sy - e.size + wob, e.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.arc(sx - e.size * 0.3, sy - e.size - e.size * 0.3 + wob, e.size * 0.35, 0, Math.PI * 2);
    ctx.fill();
    if (e.hp < e.maxHp) {
      const bw = e.size * 2;
      ctx.fillStyle = '#300';
      ctx.fillRect(sx - bw/2, sy - e.size * 2 - 4, bw, 2);
      ctx.fillStyle = '#f66';
      ctx.fillRect(sx - bw/2, sy - e.size * 2 - 4, bw * (e.hp/e.maxHp), 2);
    }
  }

  // 经验宝石: 青色菱形, 上下浮动, 价值越高越大
  for (const g of gems) {
    const sx = g.x - camX, sy = g.y - camY + Math.sin(g.bob) * 2;
    const r = Math.min(6, 2.5 + g.value * 0.4);
    ctx.fillStyle = '#7df9ff';
    ctx.beginPath();
    ctx.moveTo(sx, sy - r);
    ctx.lineTo(sx + r * 0.7, sy);
    ctx.lineTo(sx, sy + r);
    ctx.lineTo(sx - r * 0.7, sy);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillRect(sx - 1, sy - r * 0.5, 1.5, 1.5);
  }

  // 子弹
  for (const b of bullets) {
    const sx = b.x - camX, sy = b.y - camY;
    ctx.fillStyle = '#ffd166';
    ctx.beginPath();
    ctx.arc(sx, sy, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }
  // 敌方弹幕: 紫色圆点带白芯
  for (const b of ebullets) {
    const sx = b.x - camX, sy = b.y - camY;
    ctx.fillStyle = '#c080ff';
    ctx.beginPath();
    ctx.arc(sx, sy, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(sx - 1, sy - 1, 2, 2);
  }

  // 玩家
  if (player) player.draw();

  // 粒子
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - camX - p.size/2, p.y - camY - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // 飘字 (字号随暴击/类型变)
  ctx.textAlign = 'center';
  for (const f of floats) {
    ctx.globalAlpha = f.life / f.maxLife;
    ctx.font = 'bold ' + (f.size || 9) + 'px Courier New';
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x - camX, f.y - camY);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // 死亡提示
  if (gameState === 'dead') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, LOGIC_W, LOGIC_H);
    ctx.fillStyle = '#f66';
    ctx.font = 'bold 20px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('你倒下了', LOGIC_W/2, LOGIC_H/2 - 10);
    ctx.fillStyle = '#fff';
    ctx.font = '12px Courier New';
    ctx.fillText('击杀: ' + kills + ' · ' + Math.ceil(deadTimer) + ' 秒后自动重来', LOGIC_W/2, LOGIC_H/2 + 20);
  }
}

// ===== 启动 =====
(async function boot() {
  // 先显示 loading
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, LOGIC_W, LOGIC_H);
  ctx.fillStyle = '#fff';
  ctx.font = '14px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('加载素材...', LOGIC_W/2, LOGIC_H/2);
  updateHud();

  await loadAllChars();

  // 加载失败也继续 (fallback 色块)
  reset();
  lastT = performance.now();
  requestAnimationFrame(loop);
})();
</script>
