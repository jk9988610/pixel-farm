<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>像素田园 · AI 幸存者</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: #000; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Courier New', monospace;
  }
  #game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #hud {
    position: fixed; top: 10px; left: 10px; right: 10px;
    color: #fff; font-size: 13px;
    text-shadow: 1px 1px 2px #000;
    display: flex; justify-content: space-between;
    pointer-events: none; z-index: 10;
  }
  #hpbar {
    position: fixed; bottom: 14px; left: 50%;
    transform: translateX(-50%);
    width: 220px; height: 16px;
    background: #400; border: 2px solid #fff;
    z-index: 10;
  }
  #hpfill { height: 100%; background: linear-gradient(90deg, #e33, #f77); width: 100%; transition: width 0.1s; }
  #hptext {
    position: fixed; bottom: 34px; left: 50%;
    transform: translateX(-50%);
    color: #fff; font-size: 11px;
    text-shadow: 1px 1px 2px #000; z-index: 10;
  }
  #err {
    position: fixed; top: 40px; left: 10px;
    color: #f66; font-size: 10px; max-width: 400px;
    background: rgba(0,0,0,0.85); padding: 6px;
    display: none; z-index: 20; line-height: 1.5;
  }
  #hint {
    position: fixed; bottom: 12px; right: 12px;
    color: #dfe8c8; font-size: 10px; text-shadow: 1px 1px 2px #000;
    z-index: 10; pointer-events: none;
  }
  #farmhud {
    position: fixed; left: 10px; bottom: 10px;
    color: #f4e8c1; font-size: 10px; line-height: 1.7;
    background: rgba(30,20,10,0.82); border: 2px solid #8b5a2b;
    padding: 6px 10px; text-shadow: 1px 1px 2px #000;
    z-index: 10; pointer-events: none;
  }
  #farmhud .key { color: #9fe07a; }
  #levelup {
    position: fixed; inset: 0; z-index: 30;
    display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: rgba(0,0,0,0.72);
  }
  .lu-title { color: #ffd166; font-size: 20px; text-shadow: 2px 2px 0 #000; }
  .lu-cards { display: flex; gap: 14px; }
  .lu-card {
    width: 120px; padding: 16px 10px; text-align: center;
    background: #1c2430; border: 2px solid #7df9ff; border-radius: 6px;
    color: #fff; font-size: 14px; cursor: pointer;
  }
  .lu-card:hover { background: #2a3648; transform: translateY(-3px); }
  .lu-card .ico { font-size: 24px; display: block; margin-bottom: 8px; }
  .lu-hint { color: #8899aa; font-size: 11px; }
</style>
</head>
<body>
<canvas id="game" width="640" height="360"></canvas>
<div id="hud">
  <div>时间: <span id="time">0:00</span></div>
  <div>击杀: <span id="kills">0</span></div>
  <div>等级: <span id="level">1</span></div>
</div>
<div id="hpbar"><div id="hpfill"></div></div>
<div id="hptext">100 / 100</div>
<div id="hint">WASD / 方向键 移动 · Esc 暂停 · 触屏可拖动左下摇杆</div>
<div id="farmhud">
  <div>金币: <span id="coins">100</span></div>
  <div>种子: <span id="seedname">萝卜</span></div>
  <div class="key">1/2/3 选种 · 空格 播种/收获</div>
</div>
<div id="err"></div>
<div id="levelup"></div>

<script type="module">
// 全局错误显示
window.addEventListener('error', (e) => {
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = 'ERR: ' + e.message;
});

const LOGIC_W = 640, LOGIC_H = 360;
const WORLD_W = 1600, WORLD_H = 1200;
const ATTACK_RANGE = 220;
const RESPAWN_DELAY = 2.0;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

function fit() {
  const s = Math.max(1, Math.floor(Math.min(window.innerWidth / LOGIC_W, window.innerHeight / LOGIC_H)));
  canvas.style.width = (LOGIC_W * s) + 'px';
  canvas.style.height = (LOGIC_H * s) + 'px';
}
window.addEventListener('resize', fit);
fit();

// ===== 素材 =====
let manifest = null;
const charTextures = {};
let charNames = [];
let usingChar = null;
let playerTex = null;

function loadImg(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error(src));
    img.src = src;
  });
}

async function loadAllChars() {
  try {
    const r = await fetch('assets/char/manifest.json', { cache: 'no-store' });
    manifest = await r.json();
  } catch (e) {
    console.warn('manifest fail', e);
    return;
  }
  const names = Object.keys(manifest.characters || {});
  for (const n of names) {
    try {
      const ch = manifest.characters[n];
      const tex = {};
      for (const [dir, acts] of Object.entries(ch)) {
        tex[dir] = {};
        for (const [act, files] of Object.entries(acts)) {
          tex[dir][act] = await Promise.all(files.map(f => loadImg(`assets/char/${n}/${f}`)));
        }
      }
      const fd = Object.keys(tex)[0];
      const fa = Object.keys(tex[fd])[0];
      const img0 = tex[fd][fa][0];
      tex.frameW = img0.naturalWidth;
      tex.frameH = img0.naturalHeight;
      charTextures[n] = tex;
      charNames.push(n);
    } catch (e) {
      console.warn('load char fail', n, e.message);
    }
  }
  usingChar = charNames.includes('villager') ? 'villager' : (charNames[0] || null);
  if (usingChar) playerTex = charTextures[usingChar];
}

// ===== 状态 =====
let player = null;
let enemies = [];
let bullets = [];
let ebullets = [];   // 敌方弹幕
let particles = [];
let floats = [];
let gems = [];
let camX = 0, camY = 0;
let gameTime = 0;
let kills = 0;
let level = 1;
let xp = 0;
let xpNext = 10;
let spawnTimer = 0;
let deadTimer = 0;
let gameState = 'playing';   // playing / paused / levelup / dead

// ===== 输入 (键盘 + 触屏摇杆) =====
const keys = new Set();
const MOVE_KEYS = new Set(['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright']);
const touch = { active: false, id: null, ox: 0, oy: 0, dx: 0, dy: 0 };
let actionQueued = false;

window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (MOVE_KEYS.has(k) || k === ' ') e.preventDefault();
  if (e.repeat) return;
  if (k === 'escape') { togglePause(); return; }
  if (k === ' ') { actionQueued = true; return; }
  if (k === '1' || k === '2' || k === '3') {
    selectedCrop = Number(k) - 1;
    updateFarmHud();
    return;
  }
  keys.add(k);
});
window.addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
window.addEventListener('blur', () => { keys.clear(); resetTouch(); });

function toLogic(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (LOGIC_W / r.width),
    y: (e.clientY - r.top) * (LOGIC_H / r.height),
  };
}
function resetTouch() {
  touch.active = false; touch.id = null; touch.dx = 0; touch.dy = 0;
}
canvas.addEventListener('pointerdown', (e) => {
  if (touch.id !== null) return;
  const p = toLogic(e);
  touch.active = true; touch.id = e.pointerId;
  touch.ox = p.x; touch.oy = p.y; touch.dx = 0; touch.dy = 0;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerId !== touch.id) return;
  const p = toLogic(e);
  const dx = p.x - touch.ox, dy = p.y - touch.oy;
  const len = Math.hypot(dx, dy);
  if (len < 6) { touch.dx = 0; touch.dy = 0; return; }
  touch.dx = dx / len; touch.dy = dy / len;
});
canvas.addEventListener('pointerup', (e) => {
  if (e.pointerId === touch.id) resetTouch();
});
canvas.addEventListener('pointercancel', (e) => {
  if (e.pointerId === touch.id) resetTouch();
});

function readMoveDir() {
  let dx = 0, dy = 0;
  if (keys.has('w') || keys.has('arrowup')) dy -= 1;
  if (keys.has('s') || keys.has('arrowdown')) dy += 1;
  if (keys.has('a') || keys.has('arrowleft')) dx -= 1;
  if (keys.has('d') || keys.has('arrowright')) dx += 1;
  if (dx || dy) {
    const l = Math.hypot(dx, dy) || 1;
    return [dx / l, dy / l];
  }
  if (touch.active && (touch.dx || touch.dy)) return [touch.dx, touch.dy];
  return [0, 0];
}

function togglePause() {
  if (gameState === 'playing') {
    gameState = 'paused';
    keys.clear();
    actionQueued = false;
    resetTouch();
  } else if (gameState === 'paused') {
    gameState = 'playing';
  }
}

// ===== 农场 =====
const FARM_COLS = 3, FARM_ROWS = 3, FARM_CELL = 34, FARM_GAP = 2;
const FARM_W = FARM_COLS * FARM_CELL + (FARM_COLS - 1) * FARM_GAP;
const FARM_X0 = Math.round(WORLD_W / 2 - FARM_W / 2);
const FARM_Y0 = WORLD_H / 2 + 52;
const CROPS = [
  { id: 'carrot', name: '萝卜', cost: 10, sell: 24, grow: 20, xp: 4,  color: '#f28c28' },
  { id: 'wheat',  name: '小麦', cost: 16, sell: 40, grow: 32, xp: 6,  color: '#e8c547' },
  { id: 'tomato', name: '番茄', cost: 26, sell: 70, grow: 48, xp: 10, color: '#e04a3a' },
];
let coins = 100;
let selectedCrop = 0;
let farmTime = 0;

function newPlots() {
  return Array.from({ length: FARM_COLS * FARM_ROWS }, () => ({ state: 'empty', crop: 0, start: 0 }));
}
let plots = newPlots();

function plotPos(i) {
  const col = i % FARM_COLS, row = Math.floor(i / FARM_COLS);
  return [FARM_X0 + col * (FARM_CELL + FARM_GAP), FARM_Y0 + row * (FARM_CELL + FARM_GAP)];
}

function nearestPlot() {
  if (!player) return -1;
  let best = -1, bd = 32;
  for (let i = 0; i < plots.length; i++) {
    const [x, y] = plotPos(i);
    const d = Math.hypot(player.x - (x + FARM_CELL / 2), player.y - (y + FARM_CELL / 2));
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}

function updateFarm(dt) {
  farmTime += dt;
  for (const p of plots) {
    if (p.state === 'growing' && farmTime - p.start >= CROPS[p.crop].grow) p.state = 'ready';
  }
}

function farmAction() {
  if (gameState !== 'playing') return;
  const i = nearestPlot();
  if (i < 0) {
    popText(player.x, player.y - 24, '靠近地块再按空格', '#dfe8c8', 10);
    return;
  }
  const p = plots[i];
  if (p.state === 'ready') {
    const c = CROPS[p.crop];
    p.state = 'empty';
    coins += c.sell;
    const [x, y] = plotPos(i);
    popText(x + FARM_CELL / 2, y + 4, '+' + c.sell + '金 +' + c.xp + 'XP', '#ffd166', 11);
    const ups = gainXp(c.xp);
    if (ups > 0) showLevelUp();
    updateFarmHud();
    return;
  }
  if (p.state === 'growing') {
    popText(player.x, player.y - 24, '还在生长', '#dfe8c8', 10);
    return;
  }
  const c = CROPS[selectedCrop];
  if (coins < c.cost) {
    popText(player.x, player.y - 24, '金币不足', '#f66', 10);
    return;
  }
  coins -= c.cost;
  p.state = 'growing';
  p.crop = selectedCrop;
  p.start = farmTime;
  const [x, y] = plotPos(i);
  popText(x + FARM_CELL / 2, y + 4, '播种 ' + c.name, '#9fe07a', 10);
  updateFarmHud();
}

function updateFarmHud() {
  const c = CROPS[selectedCrop];
  $('coins').textContent = coins;
  $('seedname').textContent = c.name + ' (' + c.cost + '金/' + c.grow + 's)';
}

function drawCrop(cx, by, c, stage) {
  if (stage === 0) {
    ctx.fillStyle = '#3f7a2a';
    ctx.fillRect(cx - 3, by - 2, 2, 2);
    ctx.fillRect(cx + 1, by - 2, 2, 2);
    return;
  }
  const h = stage === 1 ? 6 : stage === 2 ? 11 : 15;
  ctx.strokeStyle = '#4f9c3a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, by);
  ctx.lineTo(cx, by - h);
  ctx.stroke();
  if (stage >= 2) {
    ctx.fillStyle = '#4f9c3a';
    ctx.fillRect(cx - 5, by - h * 0.55, 4, 2);
    ctx.fillRect(cx + 1, by - h * 0.7, 4, 2);
  }
  if (stage < 3) return;
  ctx.fillStyle = c.color;
  if (c.id === 'carrot') {
    ctx.beginPath();
    ctx.moveTo(cx - 3, by - 4);
    ctx.lineTo(cx + 3, by - 4);
    ctx.lineTo(cx, by + 4);
    ctx.closePath();
    ctx.fill();
  } else if (c.id === 'wheat') {
    for (let i = -1; i <= 1; i++) ctx.fillRect(cx + i * 4 - 1, by - h - 3, 2, 6);
  } else {
    ctx.beginPath();
    ctx.arc(cx - 4, by - h + 3, 3, 0, Math.PI * 2);
    ctx.arc(cx + 4, by - h + 5, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawFarm() {
  const near = nearestPlot();
  for (let i = 0; i < plots.length; i++) {
    const [x, y] = plotPos(i);
    const sx = x - camX, sy = y - camY;
    if (sx < -40 || sx > LOGIC_W + 40 || sy < -40 || sy > LOGIC_H + 40) continue;
    const p = plots[i];
    ctx.fillStyle = p.state === 'empty' ? '#6b4a2a' : '#563a20';
    ctx.fillRect(sx, sy, FARM_CELL, FARM_CELL);
    ctx.strokeStyle = '#3f2a14';
    ctx.lineWidth = 1;
    ctx.strokeRect(sx + 0.5, sy + 0.5, FARM_CELL - 1, FARM_CELL - 1);
    if (p.state !== 'empty') {
      const c = CROPS[p.crop];
      const prog = Math.min(1, (farmTime - p.start) / c.grow);
      const stage = p.state === 'ready' ? 3 : Math.min(2, Math.floor(prog * 3));
      drawCrop(sx + FARM_CELL / 2, sy + 28, c, stage);
    }
    if (near === i) {
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 2;
      ctx.strokeRect(sx + 1, sy + 1, FARM_CELL - 2, FARM_CELL - 2);
    }
  }
  if (near >= 0) {
    const p = plots[near];
    const [x, y] = plotPos(near);
    let label;
    if (p.state === 'empty') label = '空格 播种';
    else if (p.state === 'ready') label = '空格 收获';
    else {
      const c = CROPS[p.crop];
      label = '生长中 ' + Math.max(1, Math.ceil(c.grow - (farmTime - p.start))) + 's';
    }
    ctx.font = '9px Courier New';
    ctx.textAlign = 'center';
    const w = ctx.measureText(label).width + 8;
    const sx = x - camX, sy = y - camY;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(sx + FARM_CELL / 2 - w / 2, sy - 13, w, 11);
    ctx.fillStyle = '#fff';
    ctx.fillText(label, sx + FARM_CELL / 2, sy - 4);
  }
}

// ===== HUD =====
const $ = id => document.getElementById(id);
function updateHud() {
  const s = Math.floor(gameTime % 60);
  $('time').textContent = Math.floor(gameTime / 60) + ':' + String(s).padStart(2, '0');
  $('kills').textContent = kills;
  $('level').textContent = level;
  if (player) {
    const pct = Math.max(0, player.hp / player.maxHp * 100);
    $('hpfill').style.width = pct + '%';
    $('hptext').textContent = Math.max(0, Math.ceil(player.hp)) + ' / ' + player.maxHp;
  }
  updateFarmHud();
}

// ===== 玩家 =====
class Player {
  constructor() {
    this.x = WORLD_W / 2;
    this.y = WORLD_H / 2;
    this.maxHp = 100;
    this.hp = 100;
    this.speed = 80;
    this.dmg = 8;
    this.atkSpeed = 0.5;
    this.projSpeed = 220;
    this.projCount = 1;   // 多弹道增益
    this.pierce = 0;      // 穿透增益
    this.critChance = 0.15;  // 暴击率
    this.critMul = 2;        // 暴击倍率
    this.knives = 0;     // 环绕飞刀数量
    this.boomerang = 0;  // 回旋镖等级
    this.laser = 0;      // 激光等级
    this.atkTimer = 0;
    this.iframe = 0;
    this.facing = 'down';
    this.dir = 1;
    this.frameIdx = 0;
    this.frameTimer = 0;
    this.state = 'idle';
  }

  update(dt) {
    if (this.iframe > 0) this.iframe -= dt;

    const [dx, dy] = readMoveDir();
    const moving = Math.abs(dx) > 0.01 || Math.abs(dy) > 0.01;

    if (moving) {
      this.x += dx * this.speed * dt;
      this.y += dy * this.speed * dt;
      this.x = Math.max(20, Math.min(WORLD_W - 20, this.x));
      this.y = Math.max(30, Math.min(WORLD_H - 10, this.y));
      if (Math.abs(dy) > Math.abs(dx)) {
        this.facing = dy < 0 ? 'up' : 'down';
      } else {
        this.facing = 'side';
        this.dir = dx > 0 ? 1 : -1;
      }
      if (this.state !== 'walk') { this.state = 'walk'; this.frameIdx = 0; this.frameTimer = 0; }
    } else {
      if (this.state !== 'idle') { this.state = 'idle'; this.frameIdx = 0; this.frameTimer = 0; }
    }

    // 自动攻击
    this.atkTimer -= dt;
    if (this.atkTimer <= 0) {
      let target = null, tD = Infinity;
      for (const e of enemies) {
        const d = Math.hypot(e.x - this.x, e.y - this.y);
        if (d < tD && d < ATTACK_RANGE) { tD = d; target = e; }
      }
      if (target) {
        const baseA = Math.atan2(target.y - this.y, target.x - this.x);
        const n = this.projCount;
        for (let i = 0; i < n; i++) {
          // 多弹道: 围绕目标方向扇形散开
          const a = baseA + (i - (n - 1) / 2) * 0.12;
          bullets.push({
            x: this.x, y: this.y - 12,
            vx: Math.cos(a) * this.projSpeed,
            vy: Math.sin(a) * this.projSpeed,
            dmg: this.dmg, life: 1.5, pierce: this.pierce, hits: null, dead: false,
          });
        }
        this.atkTimer = this.atkSpeed;
      } else {
        this.atkTimer = 0.1;
      }
    }

    // 帧动画
    const fps = this.state === 'walk' ? 8 : 4;
    this.frameTimer += dt;
    if (this.frameTimer > 1 / fps) {
      this.frameTimer = 0;
      this.frameIdx++;
    }
  }

  takeDamage(dmg) {
    if (this.iframe > 0) return;
    this.hp -= dmg;
    this.iframe = 0.4;
    if (this.hp <= 0) {
      this.hp = 0;
      gameState = 'dead';
      deadTimer = RESPAWN_DELAY;
    }
    updateHud();
  }

  draw() {
    const sx = Math.round(this.x - camX);
    const sy = Math.round(this.y - camY);
    // 影子
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(sx, sy + 1, 8, 3, 0, 0, Math.PI * 2);
    ctx.fill();

    // 有素材用素材
    if (playerTex) {
      const dd = playerTex[this.facing] || playerTex.down || playerTex.side;
      if (dd) {
        const arr = dd[this.state] || dd.idle;
        if (arr && arr.length) {
          if (!(this.iframe > 0 && Math.floor(this.iframe * 20) % 2 === 0)) {
            const img = arr[this.frameIdx % arr.length];
            const fw = playerTex.frameW, fh = playerTex.frameH;
            ctx.save();
            ctx.translate(sx, sy);
            if (this.facing === 'side') ctx.scale(this.dir, 1);
            ctx.drawImage(img, -Math.floor(fw / 2), -fh);
            ctx.restore();
          }
          return;
        }
      }
    }

    // fallback: 色块小人
    ctx.fillStyle = '#4a8a3a';
    ctx.fillRect(sx - 5, sy - 10, 10, 10);
    ctx.fillStyle = '#f2c9a0';
    ctx.beginPath();
    ctx.arc(sx, sy - 14, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#4a4a6e';
    ctx.fillRect(sx - 4, sy, 3, 3);
    ctx.fillRect(sx + 1, sy, 3, 3);
  }
}

// ===== 敌人 =====
// kind: chase 追击(默认) / charger 冲刺球 / splitter 分裂球 / shooter 远程弹幕球
const ENEMY_TYPES = [
  { color: '#e33', hp: 10, speed: 45, size: 6, dmg: 8, xp: 1 },
  { color: '#f80', hp: 15, speed: 55, size: 7, dmg: 10, xp: 2 },
  { color: '#f0f', hp: 22, speed: 38, size: 8, dmg: 12, xp: 3 },
  { color: '#3cf', hp: 35, speed: 32, size: 10, dmg: 15, xp: 5 },
  { color: '#ff0', hp: 70, speed: 26, size: 13, dmg: 20, xp: 10 },
  { kind: 'charger',  color: '#ff5da2', hp: 18, speed: 30, size: 7, dmg: 14, xp: 4 },
  { kind: 'splitter', color: '#8fe040', hp: 20, speed: 36, size: 9, dmg: 10, xp: 4 },
  { kind: 'shooter',  color: '#9d6bff', hp: 16, speed: 28, size: 7, dmg: 8,  xp: 5 },
];

function pickType() {
  let maxI = 0;
  if (gameTime > 10) maxI = 1;
  if (gameTime > 30) maxI = 2;
  if (gameTime > 60) maxI = 3;
  if (gameTime > 90) maxI = 4;
  if (gameTime > 100) maxI = 5;   // 冲刺球
  if (gameTime > 120) maxI = 6;   // 分裂球
  if (gameTime > 140) maxI = 7;   // 弹幕球
  return ENEMY_TYPES[Math.floor(Math.random() * (maxI + 1))];
}

// ===== Boss (每 60s 一只, 高血大体积, 环绕弹幕+蓄力冲刺, 掉稀有增益) =====
let bossT = 60;   // 距下一只 boss 的秒数
function spawnBoss() {

// ===== 武器系统 (基础子弹之外: 环绕飞刀/回旋镖/激光, 经升级卡获得) =====
let knifeAngle = 0;
let boomT = 0, laserT = 0;
let booms = [];   // 回旋镖
let beams = [];   // 激光光束(纯视觉)

// 通用击杀: 掉宝石/分裂/震屏
function killEnemy(e) {
  if (e.dead) return;
  e.dead = true;
  kills++;
  burst(e.x, e.y, e.color, 8);
  addShake(0.12, 2.5);
  spawnGem(e.x, e.y, e.xp);
  if (e.kind === 'boss') {
    spawnRareGem(e.x + 14, e.y);
    addShake(0.35, 5);
    popText(e.x, e.y - 30, 'BOSS 击破!', '#ffd166', 16);
  }
  if (e.kind === 'splitter') {
    spawnMini(e.x, e.y, e.color);
    spawnMini(e.x, e.y, e.color);
  }
}
// 武器通用伤害: 掷暴击 + 飘字 + 闪白 + 击杀
function weaponHit(e, base, burstN) {
  const crit = Math.random() < player.critChance;
  const dmg = Math.round(base * (crit ? player.critMul : 1));
  e.hp -= dmg;
  e.flash = 0.08;
  burst(e.x, e.y, e.color, burstN || 2);
  popText(e.x, e.y - e.size * 2 - 4, String(dmg), crit ? '#ffb020' : '#ffffff', crit ? 13 : 9);
  if (e.hp <= 0) killEnemy(e);
}
// 稀有宝石: boss 掉落, 拾取直接获得随机增益
function spawnRareGem(x, y) {
  gems.push({ x, y, value: 0, kind: 'rare', bob: 0, vx: 0, vy: 0 });
}
function applyRandomUpgrade() {
  const c = UPGRADES[Math.floor(Math.random() * UPGRADES.length)];
  c.apply(player);
  popText(player.x, player.y - 34, '稀有增益: ' + c.name, '#ffd166', 12);
  updateHud();
}
function nearestEnemyTo(x, y, maxD) {
  let best = null, bd = maxD;
  for (const e of enemies) {
    if (e.dead) continue;
    const d = Math.hypot(e.x - x, e.y - y);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}
// 点到线段距离 (激光判定用)
function distToSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy || 1;
  let t = ((px - x1) * dx + (py - y1) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}
// 飞刀第 i 把的位置
function knifePos(i, n) {
  const a = knifeAngle + i * Math.PI * 2 / n;
  return [player.x + Math.cos(a) * 45, player.y + Math.sin(a) * 45];
}
function updateWeapons(dt) {
  // 环绕飞刀: 每把对接触敌人造成伤害, 同一敌人 0.4s 内只吃一次
  if (player.knives > 0) {
    knifeAngle += dt * 3.2;
    for (let i = 0; i < player.knives; i++) {
      const [kx, ky] = knifePos(i, player.knives);
      for (const e of enemies) {
        if (e.dead || (e.knifeCd || 0) > 0) continue;
        if (Math.hypot(e.x - kx, e.y - ky) < e.size + 6) {
          e.knifeCd = 0.4;
          weaponHit(e, 4 + player.dmg * 0.5);
        }
      }
    }
  }
  for (const e of enemies) if (e.knifeCd > 0) e.knifeCd -= dt;

  // 回旋镖: 飞出 150px 折返, 每敌人一次投掷只吃一次, 等级缩短冷却
  if (player.boomerang > 0) {
    boomT -= dt;
    if (boomT <= 0) {
      const t = nearestEnemyTo(player.x, player.y, 400);
      if (t) {
        boomT = Math.max(1.2, 3 - player.boomerang * 0.3);
        booms.push({
          x: player.x, y: player.y - 12,
          a: Math.atan2(t.y - player.y, t.x - player.x),
          dist: 0, spin: 0,
          dmg: Math.round(player.dmg * (1 + 0.3 * (player.boomerang - 1))),
          hits: new Set(), dead: false,
        });
      } else boomT = 0.3;
    }
  }
  for (const b of booms) {
    if (b.dead) continue;
    const sp = 260;
    b.spin += dt * 12;
    if (b.dist < 150) {
      b.x += Math.cos(b.a) * sp * dt;
      b.y += Math.sin(b.a) * sp * dt;
      b.dist += sp * dt;
    } else {
      const dx = player.x - b.x, dy = (player.y - 12) - b.y;
      const d = Math.hypot(dx, dy) || 1;
      b.x += dx / d * sp * dt;
      b.y += dy / d * sp * dt;
      if (d < 10) { b.dead = true; continue; }
    }
    for (const e of enemies) {
      if (e.dead || b.hits.has(e)) continue;
      if (Math.hypot(e.x - b.x, e.y - b.y) < e.size + 5) {
        b.hits.add(e);
        weaponHit(e, b.dmg);
      }
    }
  }
  booms = booms.filter(b => !b.dead);

  // 激光: 瞬发光束, 对线上所有敌人造成伤害, 等级缩短冷却
  if (player.laser > 0) {
    laserT -= dt;
    if (laserT <= 0) {
      const t = nearestEnemyTo(player.x, player.y, 500);
      if (t) {
        laserT = Math.max(1.5, 4 - player.laser * 0.4);
        const x1 = player.x, y1 = player.y - 12;
        const dmg = Math.round(player.dmg * (1.5 + 0.3 * (player.laser - 1)));
        for (const e of enemies) {
          if (e.dead) continue;
          if (distToSeg(e.x, e.y, x1, y1, t.x, t.y) < e.size + 4) weaponHit(e, dmg, 3);
        }
        beams.push({ x1, y1, x2: t.x, y2: t.y, ttl: 0.2, max: 0.2 });
        addShake(0.08, 1.5);
      } else laserT = 0.3;
    }
  }
  for (const bm of beams) bm.ttl -= dt;
  beams = beams.filter(b => b.ttl > 0);
}

// ===== 经验宝石 (敌人死亡掉落, 靠近吸附, 拾取攒经验) =====
const GEM_MAGNET_R = 90;   // 吸附半径
const GEM_PICK_R = 10;     // 拾取半径
function spawnGem(x, y, value) {
  gems.push({ x, y, value, bob: Math.random() * Math.PI * 2, vx: 0, vy: 0 });
}
function updateGems(dt) {
  for (const g of gems) {
    const dx = player.x - g.x, dy = player.y - g.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d < GEM_PICK_R) {
      g.dead = true;
      if (g.kind === 'rare') {
        applyRandomUpgrade();   // 稀有宝石: 直接给增益, 不加经验
      } else {
        // 升级则暂停弹三选一; 已在选卡界面时攒着, 选完下颗宝石再触发
        if (gainXp(g.value) > 0 && gameState === 'playing') showLevelUp();
        popText(g.x, g.y - 10, '+' + g.value, '#7df9ff');
      }
    } else if (d < GEM_MAGNET_R) {
      // 越近吸得越快
      const pull = 260 * (1 - d / GEM_MAGNET_R) + 60;
      g.vx += dx / d * pull * dt * 6;
      g.vy += dy / d * pull * dt * 6;
    }
    g.vx *= 0.9; g.vy *= 0.9;
    g.x += g.vx * dt;
    g.y += g.vy * dt;
    g.bob += dt * 4;
  }
  gems = gems.filter(g => !g.dead);
}

// ===== 粒子/飘字 =====
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 40 + Math.random() * 60;
    particles.push({
      x, y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20,
      life: 0.4, maxLife: 0.4,
      color, size: 1 + Math.random() * 2,
    });
  }
}

function popText(x, y, text, color, size) {
  floats.push({ x, y, text, color, size: size || 9, life: 0.8, maxLife: 0.8, vy: -40 });
}

// 屏幕震动: t=时长秒, mag=幅度px
let shakeT = 0, shakeDur = 0, shakeMag = 0;
function addShake(t, mag) {
  if (t > shakeT) { shakeT = t; shakeDur = t; }
  shakeMag = Math.max(shakeMag, mag);
}

// ===== 游戏重置 =====
function reset() {
  player = new Player();
  // 应用素材角色属性微调 (不同角色差异)
  if (usingChar === 'girl') { player.speed = 100; player.dmg = 6; player.atkSpeed = 0.4; player.maxHp = 80; player.hp = 80; }
  else if (usingChar === 'elder') { player.speed = 60; player.dmg = 12; player.atkSpeed = 0.8; player.maxHp = 130; player.hp = 130; }
  else if (usingChar === 'merchant') { player.speed = 85; player.dmg = 10; player.atkSpeed = 0.6; }
  else if (usingChar === 'child') { player.speed = 110; player.dmg = 5; player.atkSpeed = 0.35; player.maxHp = 70; player.hp = 70; }

  enemies = [];
  bullets = [];
  ebullets = [];
  particles = [];
  floats = [];
  gems = [];
  gameTime = 0;
  kills = 0;
  knifeAngle = 0; boomT = 0; laserT = 0;
  booms = [];
  beams = [];
  level = 1;
  xp = 0;
  xpNext = 10;
  coins = 100;
  selectedCrop = 0;
  plots = newPlots();
  farmTime = 0;
  spawnTimer = 0;
  deadTimer = 0;
  bossT = 60;
  shakeT = 0; shakeDur = 0; shakeMag = 0;
  gameState = 'playing';
  actionQueued = false;
  camX = player.x - LOGIC_W / 2;
  camY = player.y - LOGIC_H / 2;
  camX = Math.max(0, Math.min(WORLD_W - LOGIC_W, camX));
  camY = Math.max(0, Math.min(WORLD_H - LOGIC_H, camY));
  updateHud();
}

// ===== 升级三选一 (升级暂停弹卡, AI 1.2s 后自动选, 也可点击) =====
const UPGRADES = [
  { id: 'dmg',    ico: '⚔', name: '攻击 +2',   apply: p => p.dmg += 2 },
  { id: 'speed',  ico: '👟', name: '移速 +15',  apply: p => p.speed += 15 },
  { id: 'hp',     ico: '♥', name: '血量 +25',  apply: p => { p.maxHp += 25; p.hp = Math.min(p.maxHp, p.hp + 25); } },
  { id: 'rate',   ico: '⚡', name: '射速 +15%', apply: p => p.atkSpeed = Math.max(0.12, p.atkSpeed * 0.85) },
  { id: 'multi',  ico: '☄', name: '弹道 +1',   apply: p => p.projCount += 1 },
  { id: 'pierce', ico: '➹', name: '穿透 +1',   apply: p => p.pierce += 1 },
  { id: 'knife',  ico: '🌀', name: '飞刀 +1',   apply: p => p.knives += 1 },
  { id: 'boomer', ico: '🪃', name: '回旋镖',    apply: p => p.boomerang += 1 },
  { id: 'laser',  ico: '🔦', name: '激光',      apply: p => p.laser += 1 },
];
// AI 选卡偏好: 新武器/弹道/穿透优先, 其次攻击/射速, 残血优先补血
function aiPickCard(cards) {
  const pref = { knife: 8, boomer: 8, laser: 7, multi: 6, pierce: 5, dmg: 4, rate: 3, speed: 1, hp: player.hp < player.maxHp * 0.5 ? 9 : 2 };
  let best = cards[0];
  for (const c of cards) if ((pref[c.id] || 0) > (pref[best.id] || 0)) best = c;
  return best;
}
let levelupTimer = 0;
function showLevelUp() {
  gameState = 'levelup';
  levelupTimer = 1.2;
  const pool = [...UPGRADES];
  const cards = [];
  for (let i = 0; i < 3; i++) cards.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  const box = $('levelup');
  box.innerHTML = '<div class="lu-title">LEVEL UP 三选一</div><div class="lu-cards"></div><div class="lu-hint">AI 自动选择中...</div>';
  const row = box.querySelector('.lu-cards');
  for (const c of cards) {
    const d = document.createElement('div');
    d.className = 'lu-card';
    d.innerHTML = `<span class="ico">${c.ico}</span>${c.name}`;
    d.onclick = () => pickUpgrade(c);
    row.appendChild(d);
  }
  box._cards = cards;
  box.style.display = 'flex';
}
function pickUpgrade(c) {
  c.apply(player);
  popText(player.x, player.y - 30, c.name, '#7df9ff');
  $('levelup').style.display = 'none';
  gameState = 'playing';
  updateHud();
}

// ===== 升级 =====
function gainXp(n) {
  xp += n;
  let ups = 0;
  while (xp >= xpNext) {
    xp -= xpNext;
    level++;
    ups++;
    xpNext = Math.floor(xpNext * 1.5);
    popText(player.x, player.y - 30, 'LEVEL UP', '#ffd166');
  }
  updateHud();
  return ups;
}

// ===== 主循环 =====
let lastT = performance.now();
let rafId = null;

function loop(t) {
  rafId = requestAnimationFrame(loop);
  try {
    const dt = Math.min(0.05, (t - lastT) / 1000);
    lastT = t;

    if (gameState === 'paused') {
      render();
      return;
    }

    if (gameState === 'dead') {
      deadTimer -= dt;
      if (deadTimer <= 0) reset();
      render();
      return;
    }

    // 选卡暂停: 只渲染 + AI 倒计时自动选
    if (gameState === 'levelup') {
      levelupTimer -= dt;
      if (levelupTimer <= 0) pickUpgrade(aiPickCard($('levelup')._cards));
      render();
      updateHud();
      return;
    }

    gameTime += dt;
    updateFarm(dt);

    // 生成敌人
    spawnTimer += dt;
    const spawnRate = Math.max(0.18, 0.9 - gameTime * 0.008);
    if (spawnTimer > spawnRate) {
      spawnTimer = 0;
      spawnEnemy();
      if (gameTime > 30 && Math.random() < 0.5) spawnEnemy();
      if (gameTime > 60 && Math.random() < 0.4) spawnEnemy();
    }

    // Boss 波次: 每 60s 一只
    bossT -= dt;
    if (bossT <= 0) {
      bossT = 60;
      spawnBoss();
    }

    player.update(dt);
    if (actionQueued) { actionQueued = false; farmAction(); }
    updateWeapons(dt);

    // 敌人
    for (const e of enemies) {
      if (e.dead) continue;
      const dx = player.x - e.x, dy = player.y - e.y;
      const d = Math.hypot(dx, dy) || 1;
      if (e.kind === 'charger') {
        // 冲刺球: 靠近 -> 蓄力(闪白停顿) -> 高速直线冲刺 -> 回到追击
        e.modeT -= dt;
        if (e.mode === 'walk') {
          e.x += dx / d * e.speed * dt;
          e.y += dy / d * e.speed * dt;
          if (d < 140) { e.mode = 'windup'; e.modeT = 0.5; }
        } else if (e.mode === 'windup') {
          e.flash = 0.05;   // 蓄力发白预警
          if (e.modeT <= 0) {
            e.mode = 'dash'; e.modeT = 0.5;
            e.dvx = dx / d; e.dvy = dy / d;
          }
        } else {   // dash
          e.x += e.dvx * e.speed * 4 * dt;
          e.y += e.dvy * e.speed * 4 * dt;
          if (e.modeT <= 0) e.mode = 'walk';
        }
      } else if (e.kind === 'boss') {
        // Boss: 追击 + 每 5s 八方向环绕弹幕 + 每 8s 蓄力冲刺
        e.shootT -= dt;
        if (e.shootT <= 0) {
          e.shootT = 5;
          for (let i = 0; i < 8; i++) {
            const a = i * Math.PI / 4;
            ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 110, vy: Math.sin(a) * 110, dmg: e.dmg, life: 4, dead: false });
          }
        }
        e.chargeT -= dt;
        e.modeT -= dt;
        if (e.mode === 'walk') {
          e.x += dx / d * e.speed * dt;
          e.y += dy / d * e.speed * dt;
          if (e.chargeT <= 0 && d < 200) { e.mode = 'windup'; e.modeT = 0.7; }
        } else if (e.mode === 'windup') {
          e.flash = 0.05;
          if (e.modeT <= 0) {
            e.mode = 'dash'; e.modeT = 0.6;
            e.dvx = dx / d; e.dvy = dy / d;
          }
        } else {
          e.x += e.dvx * e.speed * 3.5 * dt;
          e.y += e.dvy * e.speed * 3.5 * dt;
          if (e.modeT <= 0) { e.mode = 'walk'; e.chargeT = 8; }
        }
      } else if (e.kind === 'shooter') {
        // 弹幕球: 保持 120-170 距离环绕, 每 2.2s 向玩家发一颗弹
        if (d > 170) { e.x += dx / d * e.speed * dt; e.y += dy / d * e.speed * dt; }
        else if (d < 120) { e.x -= dx / d * e.speed * 0.7 * dt; e.y -= dy / d * e.speed * 0.7 * dt; }
        else {
          // 侧向环绕
          e.x += -dy / d * e.speed * 0.5 * dt;
          e.y += dx / d * e.speed * 0.5 * dt;
        }
        e.shootT -= dt;
        if (e.shootT <= 0 && d < 260) {
          e.shootT = 2.2;
          ebullets.push({ x: e.x, y: e.y, vx: dx / d * 130, vy: dy / d * 130, dmg: e.dmg, life: 3, dead: false });
        }
      } else {
        // chase / splitter: 直线追击
        e.x += dx / d * e.speed * dt;
        e.y += dy / d * e.speed * dt;
      }
      e.wobble += dt * 8;
      if (e.flash > 0 && e.mode !== 'windup') e.flash -= dt;
      if (d < e.size + 6) player.takeDamage(e.dmg);
    }

    // 敌方弹幕
    for (const b of ebullets) {
      if (b.dead) continue;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      if (b.life <= 0) { b.dead = true; continue; }
      if (Math.hypot(b.x - player.x, b.y - player.y) < 8) {
        b.dead = true;
        player.takeDamage(b.dmg);
      }
    }
    ebullets = ebullets.filter(b => !b.dead);

    // 子弹
    for (const b of bullets) {
      if (b.dead) continue;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      if (b.life <= 0) { b.dead = true; continue; }
      for (const e of enemies) {
        if (e.dead) continue;
        if (b.hits && b.hits.has(e)) continue;   // 穿透弹不重复打同一敌人
        if (Math.hypot(b.x - e.x, b.y - e.y) < e.size + 3) {
          // 暴击: 命中时掷一次, 伤害 x2 且飘字更大更亮
          const crit = Math.random() < player.critChance;
          const dmg = Math.round(b.dmg * (crit ? player.critMul : 1));
          e.hp -= dmg;
          e.flash = 0.08;
          burst(b.x, b.y, e.color, crit ? 5 : 3);
          popText(e.x, e.y - e.size * 2 - 4, String(dmg), crit ? '#ffb020' : '#ffffff', crit ? 13 : 9);
          addShake(crit ? 0.14 : 0.06, crit ? 3 : 1.2);
          if (b.pierce > 0) {
            b.pierce--;
            (b.hits || (b.hits = new Set())).add(e);
          } else {
            b.dead = true;
          }
          if (e.hp <= 0) killEnemy(e);
          if (b.dead) break;
        }
      }
    }
    bullets = bullets.filter(b => !b.dead && b.life > 0);
    enemies = enemies.filter(e => !e.dead);

    updateGems(dt);

    // 粒子
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 100 * dt;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);

    for (const f of floats) {
      f.y += f.vy * dt;
      f.life -= dt;
    }
    floats = floats.filter(f => f.life > 0);

    // 屏幕震动衰减
    if (shakeT > 0) {
      shakeT -= dt;
      if (shakeT <= 0) shakeMag = 0;
    }

    // 相机
    camX = player.x - LOGIC_W / 2;
    camY = player.y - LOGIC_H / 2;
    camX = Math.max(0, Math.min(WORLD_W - LOGIC_W, camX));
    camY = Math.max(0, Math.min(WORLD_H - LOGIC_H, camY));
    camX = Math.round(camX);
    camY = Math.round(camY);

    render();
    updateHud();
  } catch (e) {
    const el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent = 'LOOP ERR: ' + e.message;
    console.error(e);
  }
}

function render() {
  ctx.save();
  // 屏幕震动: 幅度随时长衰减
  if (shakeT > 0 && shakeDur > 0) {
    const k = shakeMag * (shakeT / shakeDur);
    ctx.translate((Math.random() - 0.5) * 2 * k, (Math.random() - 0.5) * 2 * k);
  }

  // 背景
  ctx.fillStyle = '#3a5a2a';
  ctx.fillRect(0, 0, LOGIC_W, LOGIC_H);

  // 网格
  const gs = 32;
  const sx0 = Math.floor(camX / gs) * gs;
  const sy0 = Math.floor(camY / gs) * gs;
  for (let gy = sy0; gy < camY + LOGIC_H + gs; gy += gs) {
    for (let gx = sx0; gx < camX + LOGIC_W + gs; gx += gs) {
      const sx = gx - camX, sy = gy - camY;
      const dark = ((gx / gs) + (gy / gs)) % 2 === 0;
      ctx.fillStyle = dark ? '#385a28' : '#3e5f2e';
      ctx.fillRect(sx, sy, gs, gs);
    }
  }

  // 农场地块与作物
  drawFarm();

  // 敌人
  for (const e of enemies) {
    const sx = e.x - camX, sy = e.y - camY;
    if (sx < -40 || sx > LOGIC_W + 40 || sy < -40 || sy > LOGIC_H + 40) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(sx, sy + e.size * 0.7, e.size * 0.9, e.size * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    const wob = Math.sin(e.wobble) * 1.5;
    ctx.fillStyle = e.flash > 0 ? '#ffffff' : e.color;   // 命中闪白
    ctx.beginPath();
    ctx.arc(sx, sy - e.size + wob, e.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.arc(sx - e.size * 0.3, sy - e.size - e.size * 0.3 + wob, e.size * 0.35, 0, Math.PI * 2);
    ctx.fill();
    if (e.kind === 'boss') {
      // Boss: 金边 + 头顶血条
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sx, sy - e.size + wob, e.size + 2, 0, Math.PI * 2);
      ctx.stroke();
      const bw = e.size * 2.4;
      ctx.fillStyle = '#000';
      ctx.fillRect(sx - bw / 2, sy - e.size * 2 - 12, bw, 4);
      ctx.fillStyle = '#ff3355';
      ctx.fillRect(sx - bw / 2, sy - e.size * 2 - 12, bw * Math.max(0, e.hp / e.maxHp), 4);
    }
    if (e.hp < e.maxHp) {
      const bw = e.size * 2;
      ctx.fillStyle = '#300';
      ctx.fillRect(sx - bw/2, sy - e.size * 2 - 4, bw, 2);
      ctx.fillStyle = '#f66';
      ctx.fillRect(sx - bw/2, sy - e.size * 2 - 4, bw * (e.hp/e.maxHp), 2);
    }
  }

  // 经验宝石: 青色菱形, 上下浮动, 价值越高越大; 稀有宝石金色更大
  for (const g of gems) {
    const sx = g.x - camX, sy = g.y - camY + Math.sin(g.bob) * 2;
    const rare = g.kind === 'rare';
    const r = rare ? 8 : Math.min(6, 2.5 + g.value * 0.4);
    ctx.fillStyle = rare ? '#ffd166' : '#7df9ff';
    ctx.beginPath();
    ctx.moveTo(sx, sy - r);
    ctx.lineTo(sx + r * 0.7, sy);
    ctx.lineTo(sx, sy + r);
    ctx.lineTo(sx - r * 0.7, sy);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillRect(sx - 1, sy - r * 0.5, 1.5, 1.5);
  }

  // 子弹
  for (const b of bullets) {
    const sx = b.x - camX, sy = b.y - camY;
    ctx.fillStyle = '#ffd166';
    ctx.beginPath();
    ctx.arc(sx, sy, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }
  // 敌方弹幕: 紫色圆点带白芯
  for (const b of ebullets) {
    const sx = b.x - camX, sy = b.y - camY;
    ctx.fillStyle = '#c080ff';
    ctx.beginPath();
    ctx.arc(sx, sy, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(sx - 1, sy - 1, 2, 2);
  }

  // 玩家
  if (player) player.draw();

  // 环绕飞刀: 银色菱形绕玩家旋转
  if (player && player.knives > 0) {
    for (let i = 0; i < player.knives; i++) {
      const [kx, ky] = knifePos(i, player.knives);
      const sx = kx - camX, sy = ky - camY;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(knifeAngle * 2 + i);
      ctx.fillStyle = '#dfe8f0';
      ctx.fillRect(-1.5, -5, 3, 10);
      ctx.restore();
    }
  }

  // 回旋镖: 黄色旋转月牙
  for (const b of booms) {
    const sx = b.x - camX, sy = b.y - camY;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(b.spin);
    ctx.fillStyle = '#ffd94d';
    ctx.fillRect(-5, -2, 10, 4);
    ctx.fillRect(-5, -2, 3, 7);
    ctx.restore();
  }

  // 激光光束: 青色亮线快速淡出
  for (const bm of beams) {
    ctx.globalAlpha = bm.ttl / bm.max;
    ctx.strokeStyle = '#7df9ff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(bm.x1 - camX, bm.y1 - camY);
    ctx.lineTo(bm.x2 - camX, bm.y2 - camY);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // 粒子
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - camX - p.size/2, p.y - camY - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // 飘字 (字号随暴击/类型变)
  ctx.textAlign = 'center';
  for (const f of floats) {
    ctx.globalAlpha = f.life / f.maxLife;
    ctx.font = 'bold ' + (f.size || 9) + 'px Courier New';
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x - camX, f.y - camY);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // 触屏摇杆
  if (touch.active) {
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#0b1408';
    ctx.beginPath();
    ctx.arc(touch.ox, touch.oy, 28, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#dfe8c8';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#7df9ff';
    ctx.beginPath();
    ctx.arc(touch.ox + touch.dx * 22, touch.oy + touch.dy * 22, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 暂停提示
  if (gameState === 'paused') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, LOGIC_W, LOGIC_H);
    ctx.fillStyle = '#ffd166';
    ctx.font = 'bold 20px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('已暂停', LOGIC_W / 2, LOGIC_H / 2 - 8);
    ctx.fillStyle = '#dfe8c8';
    ctx.font = '12px Courier New';
    ctx.fillText('按 Esc 继续', LOGIC_W / 2, LOGIC_H / 2 + 20);
  }

  // 死亡提示
  if (gameState === 'dead') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, LOGIC_W, LOGIC_H);
    ctx.fillStyle = '#f66';
    ctx.font = 'bold 20px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('你倒下了', LOGIC_W/2, LOGIC_H/2 - 10);
    ctx.fillStyle = '#fff';
    ctx.font = '12px Courier New';
    ctx.fillText('击杀: ' + kills + ' · ' + Math.ceil(deadTimer) + ' 秒后自动重来', LOGIC_W/2, LOGIC_H/2 + 20);
  }
}

// ===== 启动 =====
(async function boot() {
  // 先显示 loading
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, LOGIC_W, LOGIC_H);
  ctx.fillStyle = '#fff';
  ctx.font = '14px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('加载素材...', LOGIC_W/2, LOGIC_H/2);
  updateHud();

  await loadAllChars();

  // 加载失败也继续 (fallback 色块)
  reset();
  lastT = performance.now();
  requestAnimationFrame(loop);
})();
</script>
